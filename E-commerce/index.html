<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-commerce</title>

  <link rel="stylesheet" href="style.css">

  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">E-commerce</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./Addproduct.html">Add Product</a>
          </li>
        </ul>
        <div class="d-flex align-items-center">
          <a class="nav-link position-relative" href="./cart.html">
            <i class="fa-solid fa-cart-shopping fs-5"></i>
            <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle" id="cartCount">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-section py-5">
    <div class="container">
      <div class="row align-items-center min-vh-75">

        <!-- Hero Content -->
        <div class="col-lg-6">
          <span class="hero-badge badge bg-primary mb-3">
            <i class="fa-solid fa-bolt"></i> NEW COLLECTION
          </span>

          <h1 class="hero-title display-4 fw-bold mb-3">
            Discover Your <span class="text-primary">Perfect Style</span>
          </h1>

          <p class="hero-description text-muted mb-4">
            Explore our latest collection of trendy products, premium quality, and amazing prices.
          </p>

          <div class="hero-buttons mb-4">
            <a href="#products" class="btn btn-primary me-2">
              Shop Now <i class="fa-solid fa-arrow-right ms-1"></i>
            </a>
            <a href="#products" class="btn btn-outline-secondary">
              Explore Collection
            </a>
          </div>

          <div class="hero-features d-flex gap-3 text-muted">
            <div><i class="fa-solid fa-truck text-primary me-1"></i> Free Delivery</div>
            <div><i class="fa-solid fa-shield-halved text-primary me-1"></i> Secure Payment</div>
            <div><i class="fa-solid fa-rotate-left text-primary me-1"></i> Easy Returns</div>
          </div>
        </div>

        <!-- Hero Image -->
        <div class="col-lg-6 mt-4 mt-lg-0">
          <div class="hero-image-wrapper text-center">
            <img src="../image/images.jpg" alt="Shopping Collection" class="img-fluid rounded shadow">
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Products Section -->
  <section id="products" class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center mb-4">Our Products</h2>
      <div class="row g-4" id="renderProducts"></div>
    </div>
  </section>

  <div class="container">
    <div class="row" id="renderproducts"></div>
  </div>

  <!-- Scripts -->
  <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
