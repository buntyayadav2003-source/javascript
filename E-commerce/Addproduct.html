<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Product</title>

    <!-- FontAwesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">E-commerce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="./index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./Addproduct.html">Add Product</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <i class="fa-solid fa-cart-shopping fs-5"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container my-5" style="max-width: 600px;">
        <h1 class="mb-4 text-center">Add Product</h1>

        <div class="mb-3">
            <label for="NameInput" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="NameInput" placeholder="Enter product name">
        </div>

        <div class="mb-3">
            <label for="DescriptionInput" class="form-label">Product Description</label>
            <textarea class="form-control" id="DescriptionInput" rows="3" placeholder="Enter description"></textarea>
        </div>

        <div class="mb-3">
            <!-- Fix: for="priceInput" केला -->
            <label for="priceInput" class="form-label">Product Price</label>
            <input type="number" class="form-control" id="priceInput" placeholder="Enter price">
        </div>

        <div class="mb-3">
            <!-- Fix: for="imagePathInput" केला -->
            <label for="imagePathInput" class="form-label">Product Image Path / URL</label>
            <input type="text" class="form-control" id="imagePathInput" placeholder="Enter image path or URL">
        </div>

        <button type="button" class="btn btn-primary w-100 py-2 mt-3" id="addNewBtnInput">Add New Product</button>
    </div>

    <!-- Scripts -->
    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
