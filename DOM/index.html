<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Royal Enfield Continental GT 650</title>

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container my-5 d-flex justify-content-center">
        <div class="product-card">
            
            <div class="image-box">
                <img id="bikeImage" src="./gt red 1.avif" alt="Royal Enfield GT 650">
            </div>

            
            <div class="card-details">
                <span class="badge-tag" id="badgeTag">BIKE</span>

                <h2 class="bike-title">Royal Enfield GT 650</h2>

                <ul class="specs-list">
                    <li><i class="fa-solid fa-motorcycle"></i> Mileage: 25 kmpl</li>
                    <li><i class="fa-solid fa-gas-pump"></i> Fuel Tank: 12.5 Litres</li>
                    <li>
                        <i class="fa-solid fa-shield-halved"></i> Rating: 
                        <span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
                    </li>
                </ul>

                <p class="color-label">Pick a color:</p>
                <div class="action-row">
                    <div class="color-options">
                        <span class="color-btn" id="red" style="background-color: #ff3b30;" ></span>
                        <span class="color-btn " id="black" style="background-color: #111111;" ></span>
                        <span class="color-btn" id="blue" style="background-color: #0056b3;" ></span>
                    </div>

                    <div class="price-box">
                        <span class="current-price">₹3,45,000</span>
                        <span class="old-price">₹3,60,000</span>
                    </div>
                </div>

                <button class="cart-btn" id="cartBtn">
                    <i class="fa-solid fa-cart-shopping"></i> Add to Cart
                </button>
            </div>
        </div>
    </div>
     
    <script src="./script.js"></script>
    
</body>

</html>
