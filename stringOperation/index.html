<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>String Operation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1 class="text-primary p-4 text-center">String Operation in Javascript</h1>
      
    <div class="container w-50">
        <div class="mb-3">
  <label for="inputPara" class="form-label">Example textarea</label>
  <textarea class="form-control" id="inputPara" rows="3"></textarea>
</div>

  <div id="Result" class="container bg-secondary" style="height: 100px;">
    Result will show here
</div>
</div>

<div class="container">
    <div class="row mt-4">
        
        <div class="col">
            <button class="btn btn-primary" onclick="convertToUpperCase()">Convert to Upper Case</button>
        </div>
        <div class="col">
             <button class="btn btn-primary">Convert to Lower Case</button>
        </div>
        <div class="col">
             <button class="btn btn-primary">Convert to camle Case</button>
        </div>
        <div class="col">
             <button class="btn btn-primary">Extract first world</button>
        </div>
    </div>
  
<div class="row mt-4">
        
        <div class="col">
            <button class="btn btn-primary">Count Number of Lines</button>
        </div>
        <div class="col">
             <button class="btn btn-primary" onclick="contVowels()">Count Vowels</button>
        </div>
        <div class="col">
             <button class="btn btn-primary" onclick="countConsonents()" >Count consonents </button>
        </div>
        <div class="col">
             <button class="btn btn-primary">Extract special charaters</button>
        </div>
    </div>

    <div class="row mt-4">
        
        <div class="col">
            <button class="btn btn-primary" onclick="CheckPalindrom()">Check Palindrom</button>
        </div>
        <div class="col">
             <button class="btn btn-primary">Count Spaces</button>
        </div>
        <div class="col">
             <button class="btn btn-primary">Replace All Spaces With Hyphens</button>
        </div>
        <div class="col">
             <button class="btn btn-primary">Sort the world</button>
        </div>
    </div>


</div>




   <script src="./scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
