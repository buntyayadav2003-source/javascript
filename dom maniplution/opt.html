<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Verification</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }
    .otp-input {
      width: 48px;
      height: 56px;
      font-size: 24px;
      font-weight: 600;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #ced4da;
      transition: all 0.2s ease-in-out;
    }
    .otp-input:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
      outline: none;
    }
    /* Hide number input spinners */
    .otp-input::-webkit-outer-spin-button,
    .otp-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm p-4 text-center" style="max-width: 420px; width: 100%;">
    <div class="card-body">
      <h4 class="card-title fw-bold mb-2">Verify Your Account</h4>
      <p class="text-muted small mb-4">
        Enter the 6-digit verification code sent to <br />
        <span class="fw-semibold text-dark">buntyayadav2003@gmail.com</span>
      </p>

      <form id="otpForm">
        <!-- 6 OTP Input Boxes -->
        <div class="d-flex justify-content-between gap-2 mb-4" id="otpInputs">
          <input type="text" maxlength="1" class="form-control otp-input" inputmode="numeric" required />
          <input type="text" maxlength="1" class="form-control otp-input" inputmode="numeric" required />
          <input type="text" maxlength="1" class="form-control otp-input" inputmode="numeric" required />
          <input type="text" maxlength="1" class="form-control otp-input" inputmode="numeric" required />
          <input type="text" maxlength="1" class="form-control otp-input" inputmode="numeric" required />
          <input type="text" maxlength="1" class="form-control otp-input" inputmode="numeric" required />
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3" id="verifyBtn">
          Verify OTP
        </button>
      </form>

      <!-- Resend OTP Timer -->
      <div class="small text-muted">
        Didn't receive the code? 
        <button id="resendBtn" class="btn btn-link p-0 small text-decoration-none" disabled>
          Resend OTP in <span id="timer">60</span>s
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const inputs = document.querySelectorAll('.otp-input');
  const form = document.getElementById('otpForm');
  const resendBtn = document.getElementById('resendBtn');
  const timerSpan = document.getElementById('timer');

  // 1. Auto-focus and navigation logic
  inputs.forEach((input, index) => {
    // Only allow numeric input
    input.addEventListener('input', (e) => {
      const val = e.target.value;
      if (!/^\d*$/.test(val)) {
        e.target.value = '';
        return;
      }
      if (val.length === 1 && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    });

    // Handle Backspace navigation
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && index > 0) {
        inputs[index - 1].focus();
      }
    });

    // Handle Paste event (e.g., pasting full 6 digits)
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
      if (/^\d{6}$/.test(pasteData)) {
        pasteData.split('').forEach((char, i) => {
          if (inputs[i]) inputs[i].value = char;
        });
        inputs[inputs.length - 1].focus();
      }
    });
  });

  // 2. Handle Form Submission
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const otpCode = Array.from(inputs).map(input => input.value).join('');
    
    if (otpCode.length === 6) {
      alert(`OTP submitted: ${otpCode}`);
      
      
    }
  });

  // 3. Resend OTP Countdown Timer
  let countdown = 60;
  let timerInterval;

  function startTimer() {
    countdown = 60;
    resendBtn.disabled = true;
    resendBtn.innerHTML = `Resend OTP in <span id="timer">${countdown}</span>s`;

    timerInterval = setInterval(() => {
      countdown--;
      const timerElement = document.getElementById('timer');
      if (timerElement) timerElement.innerText = countdown;

      if (countdown <= 0) {
        clearInterval(timerInterval);
        resendBtn.disabled = false;
        resendBtn.innerText = 'Resend OTP';
      }
    }, 1000);
  }

  resendBtn.addEventListener('click', () => {
    inputs.forEach(input => input.value = '');
    inputs[0].focus();
    alert('A new OTP has been sent!');
    startTimer();
  });

  
  startTimer();
</script>

</body>
</html>
