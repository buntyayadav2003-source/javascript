<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>String Operation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <h1 class="text-primary p-4 text-center">String Operation in Javascript</h1>
      
    <div class="container w-50">
      <div class="mb-3">
        <label for="inputPara" class="form-label">Enter Text Below:</label>
        <textarea class="form-control" id="inputPara" rows="3"></textarea>
      </div>

      <!-- Result Container with id="Result" -->
      <div id="Result" class="container bg-secondary text-white p-3 rounded" style="min-height: 100px;">
        Result will show here
      </div>
    </div>

    <div class="container">
      <div class="row mt-4">
        <div class="col">
          <!-- Added () to convertToUpperCase() -->
          <button class="btn btn-primary w-100" onclick="convertToUpperCase()">Convert to Upper Case</button>
        </div>
        <div class="col">
          <button class="btn btn-primary w-100" onclick="convertToLowerCase()">Convert to Lower Case</button>
        </div>
        <div class="col">
          <button class="btn btn-primary w-100" onclick="convertToCamelCase()">Convert to Camel Case</button>
        </div>
        <div class="col">
          <button class="btn btn-primary w-100" onclick="extractFirstWord()">Extract First Word</button>
        </div>
      </div>
      
      <div class="row mt-4">
        <div class="col">
          <button class="btn btn-primary w-100" onclick="countLines()">Count Number of Lines</button>
        </div>
        <div class="col">
          <button class="btn btn-primary w-100" onclick="countVowels()">Count Vowels</button>
        </div>
        <div class="col">
          <button class="btn btn-primary w-100" onclick="countConsonants()">Count Consonants</button>
        </div>
        <div class="col">
          <button class="btn btn-primary w-100" onclick="extractSpecialChars()">Extract Special Characters</button>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col">
          <button class="btn btn-primary w-100" onclick="checkPalindrome()">Check Palindrome</button>
        </div>
        <div class="col">
          <button class="btn btn-primary w-100" onclick="countSpaces()">Count Spaces</button>
        </div>
        <div class="col">
          <button class="btn btn-primary w-100" onclick="replaceSpacesWithHyphens()">Replace Spaces With Hyphens</button>
        </div>
        <div class="col">
          <button class="btn btn-primary w-100" onclick="sortWords()">Sort Words</button>
        </div>
      </div>
    </div>

    <script src="./scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
